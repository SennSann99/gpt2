model_cfg:
  bias: false
  block_size: 64
  dropout: 0.1
  n_embd: 128
  n_head: 2
  n_layer: 2
  vocab_size: 50257
train_cfg:
  amp: true
  batch_size: 2
  beta1: 0.9
  beta2: 0.95
  checkpoint_path: checkpoints/last.ckpt
  data_path: data/Papers.csv
  eval_batches: 1
  eval_interval: 1
  grad_clip: 1.0
  learning_rate: 0.0003
  limit_rows: 40
  max_steps: 2
  num_workers: 0
  seed: 1337
  text_column: PaperText
  val_rows: 20
  warmup_steps: 100
  weight_decay: 0.1
