<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#586069" />
    </marker>
    <style>
      .box { fill: #f6f8fa; stroke: #d1d5da; stroke-width: 2px; rx: 6px; }
      .box-text { fill: #24292e; font-size: 14px; text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
      .label-text { fill: #6a737d; font-size: 12px; font-weight: 400; text-anchor: middle; }
      .line { fill: none; stroke: #586069; stroke-width: 1.5px; }
    </style>
  </defs>

  <!-- Entry Point: main.py -->
  <rect x="225" y="40" width="150" height="40" class="box" />
  <text x="300" y="60" class="box-text">main.py</text>

  <!-- Entry Points: train.py / generate.py -->
  <rect x="100" y="140" width="150" height="40" class="box" />
  <text x="175" y="160" class="box-text">gpt2/train.py</text>

  <rect x="350" y="140" width="150" height="40" class="box" />
  <text x="425" y="160" class="box-text">gpt2/generate.py</text>

  <!-- Core Components -->
  <rect x="20" y="300" width="140" height="40" class="box" />
  <text x="90" y="320" class="box-text">データ (data.py)</text>

  <rect x="230" y="300" width="140" height="40" class="box" />
  <text x="300" y="320" class="box-text">モデル (model.py)</text>

  <rect x="440" y="300" width="140" height="40" class="box" />
  <text x="510" y="320" class="box-text">設定 (config.py)</text>

  <!-- Connections from main.py -->
  <path d="M 300 80 L 175 140" class="line" marker-end="url(#arrow)" />
  <text x="220" y="105" class="label-text">学習時</text>

  <path d="M 300 80 L 425 140" class="line" marker-end="url(#arrow)" />
  <text x="380" y="105" class="label-text">推論時</text>

  <!-- Connections from train.py -->
  <path d="M 175 180 L 90 300" class="line" marker-end="url(#arrow)" />
  <path d="M 175 180 L 280 300" class="line" marker-end="url(#arrow)" />
  <path d="M 175 180 L 440 300" class="line" marker-end="url(#arrow)" />

  <!-- Connections from generate.py -->
  <path d="M 425 180 L 320 300" class="line" marker-end="url(#arrow)" />
  <path d="M 425 180 L 510 300" class="line" marker-end="url(#arrow)" />

</svg>
